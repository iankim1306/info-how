name: Daily scheduled publish

# PC가 꺼져 있어도 GitHub 서버가 매일 대신 빌드·배포한다.
# - 매일 00:00 UTC(= 한국시간 09:00)에 실행
# - 예약글(publishAt 미래)은 그날이 되면 자동으로 라이브 전환
# - 수동 실행(workflow_dispatch)도 가능

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:        # GitHub Actions 탭에서 수동 실행 버튼
  push:
    branches: [ main ]      # 새 글 push하면 즉시 재빌드·배포
    paths:
      - '_scripts/**'
      - 'reviews/**'

# keepalive 커밋을 푸시해야 해서 쓰기 권한이 필요하다
permissions:
  contents: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 빌드 스크립트는 외부 패키지가 없어 install 불필요.
      # build-reviews / build-forms 가 "오늘"(UTC) 기준으로
      # publishAt 이 지난 글만 라이브로 생성한다.
      - name: 사이트 빌드 (예약글 날짜 필터 적용)
        run: |
          node _scripts/build-reviews.cjs
          node _scripts/build-forms.cjs

      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=info-how --branch=main --commit-dirty=true

      # 🔴 저장소에 60일 동안 커밋이 없으면 GitHub 가 예약 실행을 자동으로 끈다
      #    (2026-10-19 실제로 꺼짐 — 마지막 커밋 8/20). 30일 넘게 조용하면 한 줄 커밋을 남긴다.
      #    .keepalive 는 push 트리거 경로(_scripts·reviews)에 없어서 재배포를 일으키지 않는다.
      - name: 예약 실행 자동 비활성화 방지 (keepalive)
        if: github.event_name == 'schedule'
        run: |
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$DAYS" -ge 30 ]; then
            date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive (스케줄 워크플로 자동 비활성화 방지)"
            git push
          else
            echo "최근 ${DAYS}일 내 활동 있음 — keepalive 생략"
          fi
